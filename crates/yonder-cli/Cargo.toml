[package]
name = "yonder-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "yonder: drive CLI agents and terminals on your machines from your phone"

[[bin]]
name = "yonder"
path = "src/main.rs"

[dependencies]
yonder-proto.workspace = true
yonder-host = { path = "../yonder-host" }
yonder-pty = { path = "../yonder-pty" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
