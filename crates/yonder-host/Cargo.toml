[package]
name = "yonder-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "yonder host daemon: relay link, Noise channels, sessions, files, notifications"

[dependencies]
yonder-proto.workspace = true
yonder-pty = { path = "../yonder-pty" }
yonder-agents = { path = "../yonder-agents" }
yonder-fs = { path = "../yonder-fs" }
yonder-notify = { path = "../yonder-notify" }
anyhow = "1"
base64 = "0.22"
dirs = "6"
dunce = "1"
futures-util = "0.3"
gethostname = "1"
getrandom = "0.3"
interprocess = { version = "2.4", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "net", "process", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
webpki-roots = "1"
if-addrs = "0.15.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
yonder-relay = { path = "../yonder-relay" }
